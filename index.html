<!DOCTYPE html>
<html>
<head>
  <title>Results</title>
</head>
<body>

<h2>Enter your ID</h2>
<input id="idInput" placeholder="Your ID">
<button onclick="checkID()">See result</button>

<div id="result" style="margin-top: 30px; font-size: 20px; white-space: pre-line;"></div>

<script>
const data = {
  "181891": "Condition : Individual Bonus\nManche tirée au sort : B2M2\nVotre score : 4/5\nProbabilité associée : 70%-80%\nRésultat final : Bonus obtenu"
};

function checkID() {
  const enteredID = document.getElementById("idInput").value.trim();
  const resultDiv = document.getElementById("result");

  if (data[enteredID]) {
    resultDiv.innerText = data[enteredID];
  } else {
    resultDiv.innerText = "ID not found. You entered: " + enteredID;
  }
}
</script>

</body>
</html>
