<!DOCTYPE html>
<html>
<head>
  <title>Results</title>
  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 100px;
    }
    input {
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
    }
    #result {
      margin-top: 30px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>

<h2>Enter your ID</h2>
<p>Les résultats seront disponibles une fois toutes les données collectées (prévu à partir du 1 juin).</p>
<input id="idInput" placeholder="Your ID">
<button onclick="checkID()">See result</button>

<div id="result"></div>

<script>
 const data = {
  "101258": "Condition : Individual Bonus\nManche tirée au sort : B2M2\nVotre score : 4/5\nProbabilité associée : 70%-80%\nRésultat final : Bonus obtenu",
  "181891": "Condition : Individual Bonus\nManche tirée au sort : B2M2\nVotre score : 4/5\nProbabilité associée : 70%-80%\nRésultat final : Bonus obtenu",
  "950112": "Condition : Team Bonus\nManche tirée au sort : B2M2\nVotre score personnel : 3/5\nScore du binôme : 8/10\nProbabilité associée : 81%-90%\nRésultat final : Bonus obtenu"
};

function checkID() {
  const id = document.getElementById("idInput").value.trim();
  const resultDiv = document.getElementById("result");

  if (data[id]) {
    resultDiv.innerText = data[id];
  } else {
    resultDiv.innerText = "ID not found";
  }
}
</script>

</body>
</html>
